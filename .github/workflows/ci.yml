name: Tests and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test backend with synthetic data
        run: python -B -m unittest discover -s skills/codex-token-monitor/assets/app -p "test_*.py" -v
      - name: Test setup and release integrity
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Test desktop discovery and local service
        run: python -B -m unittest discover -s desktop -p "test_runtime.py" -v
      - name: Build skill archive
        run: python -B tooling/build_release.py
      - name: Verify archive and checksum
        run: python -B tooling/build_release.py --check
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: python -m pip install -r tooling/requirements-build.txt
      - name: Audit installer on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_installer.ps1
      - name: Audit installer on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_installer.ps1
      - name: Build standalone Windows app
        if: runner.os == 'Windows'
        run: python tooling/build_windows.py
      - name: Exercise EXE without Python on PATH
        if: runner.os == 'Windows'
        run: python desktop/test_executable.py --exe dist/CodexMonitorFish-Windows.exe
