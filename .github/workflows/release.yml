name: Build downloadable apps and skill

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test backend with synthetic data
        run: python -B -m unittest discover -s skills/codex-token-monitor/assets/app -p "test_*.py" -v
      - name: Test setup and release integrity
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Build skill archive
        run: python -B tooling/build_release.py
      - name: Verify archive and checksum
        run: python -B tooling/build_release.py --check
      - name: Upload downloadable files
        uses: actions/upload-artifact@v7
        with:
          name: codex-token-monitor-skill
          path: |
            dist/codex-token-monitor-skill.zip
            dist/codex-token-monitor-skill.zip.sha256
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install -r tooling/requirements-build.txt
      - name: Test desktop service
        run: python -B -m unittest discover -s desktop -p "test_runtime.py" -v
      - name: Audit installer
        shell: powershell
        run: ./tests/test_installer.ps1
      - name: Build EXE
        run: python tooling/build_windows.py
      - name: Check EXE from a clean folder
        run: python desktop/test_executable.py --exe dist/CodexMonitorFish-Windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: codex-monitor-fish-windows
          path: |
            dist/CodexMonitorFish-Windows.exe
            dist/CodexMonitorFish-Windows.exe.sha256
          if-no-files-found: error
          retention-days: 30
